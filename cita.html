<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCANUM · Cita</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root{--bg:#191919;--violet:#A855F7;--magenta:#E838C8;--cyan:#4CE0F5;--ink:#EAF3FF;--muted:#9A87BD}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Cinzel',serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:4px;overflow:hidden}
  #card{width:840px;flex:0 0 auto;transform-origin:center center;position:relative;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 0%,rgba(120,90,220,.22),transparent 60%),linear-gradient(180deg,#161027,#0E0A1B 88%);
    border:1px solid rgba(168,85,247,.26);border-radius:18px;padding:34px 30px;text-align:center}
  #card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;background:
    radial-gradient(1.5px 1.5px at 18% 28%,rgba(255,255,255,.4),transparent),
    radial-gradient(1.5px 1.5px at 82% 22%,rgba(76,224,245,.45),transparent),
    radial-gradient(1.5px 1.5px at 68% 78%,rgba(232,56,200,.4),transparent),
    radial-gradient(1px 1px at 30% 82%,rgba(255,255,255,.32),transparent),
    radial-gradient(1px 1px at 90% 66%,rgba(255,255,255,.3),transparent)}
  #card>*{position:relative}
  .flourish{font-size:15px;letter-spacing:.5em;color:var(--cyan);text-shadow:0 0 10px var(--cyan);margin-bottom:18px;animation:glowpulse 3.2s ease-in-out infinite, rise 1s ease both}
  .flourish.bottom{margin:18px 0 0}
  .quote{font-weight:700;text-transform:uppercase;line-height:1.12;letter-spacing:.04em;font-size:46px;color:#EAF0FF;
    text-shadow:0 0 8px rgba(255,255,255,.55),0 0 22px rgba(120,180,255,.55),0 0 44px rgba(168,85,247,.6),0 0 70px rgba(232,56,200,.4);
    animation:glowpulse 3.6s ease-in-out infinite, rise 1.1s .1s ease both}
  .author{font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;text-shadow:none;margin-top:16px;animation:rise 1s .4s ease both}
  @keyframes glowpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.flourish,.quote,.author{animation:none}}
</style>
</head>
<body>
 <div id="stage">
  <div id="card">
    <div class="flourish">✦ ◆ ✦</div>
    <div class="quote" id="quote">Somos lo que hacemos repetidamente. La excelencia, entonces, no es un acto, sino un hábito.</div>
    <div class="flourish bottom">✧ ✦ ✧</div>
    <div class="author" id="author">— Aristóteles</div>
  </div>
 </div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dec=function(s){try{return decodeURIComponent(s);}catch(e){return s;}};
  if(q.get('texto'))  document.getElementById('quote').textContent=dec(q.get('texto'));
  if(q.get('autor')!==null) document.getElementById('author').textContent='— '+dec(q.get('autor'));
  if(q.get('autor')==='') document.getElementById('author').style.display='none';
  var card=document.getElementById('card');
  function fit(){
    card.style.transform='none';
    var vw=window.innerWidth-8, vh=window.innerHeight-8;
    var w=card.offsetWidth, h=card.offsetHeight;
    var s=Math.min(vw/w, vh/h); s=Math.max(.15, Math.min(s,1.6));
    card.style.transform='scale('+s+')';
  }
  var raf;function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fit);}
  window.addEventListener('resize',schedule);
  window.addEventListener('orientationchange',schedule);
  if(window.ResizeObserver){new ResizeObserver(schedule).observe(document.body);}
  fit();
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
  setTimeout(fit,300);setTimeout(fit,900);
})();
</script>
</body>
</html>
