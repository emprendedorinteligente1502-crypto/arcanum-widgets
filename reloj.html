<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCANUM · Reloj</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root{--bg:#191919;--violet:#A855F7;--ink:#F3E9FF;--muted:#8E7BB0;--line:rgba(168,85,247,.3)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:4px}
  #root{width:440px;flex:0 0 auto;transform-origin:center center;display:flex;gap:10px}
  .panel{flex:1;position:relative;background:linear-gradient(180deg,#241536,#0E0819);border:1px solid var(--line);border-radius:16px;padding:16px 10px 12px;text-align:center;overflow:hidden;box-shadow:0 0 30px rgba(168,85,247,.12) inset}
  .panel::after{content:"";position:absolute;left:0;right:0;top:52%;height:1px;background:rgba(0,0,0,.7);box-shadow:0 1px 0 rgba(168,85,247,.25)}
  .big{font-size:64px;font-weight:700;line-height:1;letter-spacing:.02em;text-shadow:0 0 24px rgba(168,85,247,.55)}
  .sub{font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:.22em;color:var(--muted);margin-top:10px}
  .flip{animation:flip .45s ease}
  @keyframes flip{0%{transform:rotateX(-72deg);opacity:.25}100%{transform:rotateX(0);opacity:1}}
  @media (prefers-reduced-motion:reduce){.flip{animation:none}}
</style></head>
<body><div id="stage"><div id="root">
  <div class="panel"><div class="big" id="h">00</div><div class="sub" id="ampm">AM</div></div>
  <div class="panel"><div class="big" id="m">00</div><div class="sub" id="dia">—</div></div>
</div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search),h24=q.get('formato')==='24';
  var dias=['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
  var eh=document.getElementById('h'),em=document.getElementById('m'),last={h:'',m:''};
  function pad(n){return n<10?'0'+n:''+n;}
  function tick(){var d=new Date(),hh=d.getHours(),ap=hh>=12?'PM':'AM';
    if(!h24){hh=hh%12;if(hh===0)hh=12;}var H=pad(hh),M=pad(d.getMinutes());
    if(H!==last.h){eh.textContent=H;eh.classList.remove('flip');void eh.offsetWidth;eh.classList.add('flip');last.h=H;}
    if(M!==last.m){em.textContent=M;em.classList.remove('flip');void em.offsetWidth;em.classList.add('flip');last.m=M;}
    document.getElementById('ampm').textContent=h24?'HORAS':ap;document.getElementById('dia').textContent=dias[d.getDay()];}
  tick();setInterval(tick,1000);
  var el=document.getElementById('root');
  function fit(){el.style.transform='none';var s=Math.min((innerWidth-8)/el.offsetWidth,(innerHeight-8)/el.offsetHeight);s=Math.max(.12,Math.min(s,1.6));el.style.transform='scale('+s+')';}
  var raf;function sch(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fit);}
  addEventListener('resize',sch);addEventListener('orientationchange',sch);if(window.ResizeObserver)new ResizeObserver(sch).observe(el);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);fit();setTimeout(fit,300);
})();
</script></body></html>
