<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCANUM · Pomodoro</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Cinzel:wght@600;700&family=Silkscreen&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#191919;--violet:#A855F7;--magenta:#E838C8;--cyan:#4CE0F5;--ink:#EFE3FF;--muted:#8E7BB0;--line:rgba(168,85,247,.28);--accent:var(--violet)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:4px}
  #root{flex:0 0 auto;transform-origin:center center}
  .card{position:relative;overflow:hidden;display:flex;align-items:stretch;gap:0;
    background:radial-gradient(90% 130% at 12% 0%,rgba(168,85,247,.22),transparent 60%),radial-gradient(80% 120% at 100% 100%,rgba(76,224,245,.12),transparent 55%),linear-gradient(150deg,#20123A,#120A20 80%);
    border:1px solid var(--line);border-radius:22px}
  .card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.3;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(90% 70% at 20% 0%,#000,transparent 72%);mask-image:radial-gradient(90% 70% at 20% 0%,#000,transparent 72%)}

  /* ---------- PANEL IZQUIERDO (texto) ---------- */
  .left{position:relative;flex:1 1 46%;min-width:0;padding:30px 26px;display:flex;flex-direction:column;justify-content:center;gap:16px}
  .eyebrow{font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:.24em;color:var(--magenta);text-transform:uppercase}
  .headline{font-family:'Cinzel',serif;font-weight:700;font-size:29px;line-height:1.22;letter-spacing:.01em;color:#F3ECFF}
  .headline .hl{background:linear-gradient(100deg,var(--violet),var(--magenta) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(232,56,200,.4))}
  .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
  .chip{display:flex;flex-direction:column;background:rgba(10,6,17,.5);border:1px solid var(--line);border-radius:11px;padding:8px 13px}
  .chip b{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:16px;line-height:1}
  .chip small{font-family:'Silkscreen',monospace;font-size:7px;letter-spacing:.12em;color:var(--muted);margin-top:4px}
  .chip.a b{color:var(--violet)} .chip.b b{color:var(--cyan)} .chip.c b{color:var(--magenta)}
  .arrowm{color:var(--muted);font-size:14px}
  .brand{margin-top:6px;font-family:'Silkscreen',monospace;font-size:8px;letter-spacing:.28em;color:var(--muted)}

  .divider{width:1px;flex:0 0 auto;margin:26px 0;background:linear-gradient(180deg,transparent,var(--line) 20%,rgba(232,56,200,.5) 50%,var(--line) 80%,transparent)}

  /* ---------- PANEL DERECHO (timer) ---------- */
  .right{flex:1 1 54%;padding:26px 28px;display:flex;flex-direction:column;justify-content:center}
  .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .mode{font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
  .cycle{font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:.14em;color:var(--muted)}
  .tstage{display:flex;align-items:center;justify-content:center;gap:26px}
  .ring{position:relative;width:180px;height:180px;flex:0 0 auto}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .bg{fill:none;stroke:rgba(168,85,247,.14);stroke-width:9}
  .ring .fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--accent));transition:stroke-dashoffset .5s linear,stroke .4s}
  .disp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .time{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:46px;line-height:1}
  .of{font-family:'Silkscreen',monospace;font-size:8px;letter-spacing:.2em;color:var(--muted);margin-top:6px}
  .side{display:flex;flex-direction:column;gap:9px;min-width:120px}
  .btn{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:14px;color:var(--ink);background:rgba(168,85,247,.12);border:1px solid var(--line);border-radius:11px;padding:11px 16px;cursor:pointer;transition:.18s;text-align:center;-webkit-user-select:none;user-select:none}
  .btn:hover{background:rgba(168,85,247,.24)}
  .btn.primary{background:linear-gradient(120deg,var(--violet),var(--magenta));border-color:transparent;box-shadow:0 4px 18px rgba(168,85,247,.35)}
  .btn.ghost{font-size:12px;padding:8px 14px;color:var(--muted)}
  .stats{display:flex;gap:8px;margin-top:18px}
  .pill{flex:1;text-align:center;background:rgba(10,6,17,.5);border:1px solid var(--line);border-radius:10px;padding:9px 6px}
  .pill b{display:block;font-family:'Chakra Petch',sans-serif;font-size:18px}
  .pill small{font-family:'Silkscreen',monospace;font-size:7.5px;letter-spacing:.12em;color:var(--muted)}

  /* ---------- MODO COMPACTO (angosto): solo el timer ---------- */
  #root.compact .left,#root.compact .divider{display:none}
  #root.compact .right{flex:1 1 100%;padding:24px}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style></head>
<body><div id="stage"><div id="root"><div class="card" id="card">
  <div class="left">
    <div class="eyebrow">⚔️ Ritual de enfoque</div>
    <div class="headline">Incrementa tu productividad y realiza mejor tus misiones de hoy con la <span class="hl">Técnica Pomodoro</span></div>
    <div class="flow">
      <div class="chip a"><b id="c-work">25</b><small>MIN ENFOQUE</small></div>
      <span class="arrowm">→</span>
      <div class="chip b"><b id="c-rest">5</b><small>MIN DESCANSO</small></div>
      <span class="arrowm">→</span>
      <div class="chip c"><b>×4</b><small>Y PAUSA LARGA</small></div>
    </div>
    <div class="brand">ARCANUM OS</div>
  </div>
  <div class="divider"></div>
  <div class="right">
    <div class="rhead"><div class="mode" id="mode">⚔️ ENFOQUE</div><div class="cycle" id="cycle">CICLO 1</div></div>
    <div class="tstage">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="arc" cx="50" cy="50" r="44"/></svg>
        <div class="disp"><div class="time" id="time">25:00</div><div class="of" id="task">SESIÓN DE PODER</div></div></div>
      <div class="side"><div class="btn primary" id="toggle">▶ Iniciar</div><div class="btn" id="skip">⏭ Saltar</div><div class="btn ghost" id="reset">↺ Reiniciar</div></div>
    </div>
    <div class="stats"><div class="pill"><b id="done">0</b><small>ENFOQUES</small></div><div class="pill"><b id="focusmin">0</b><small>MIN TOTALES</small></div><div class="pill"><b id="streak">0</b><small>SEGUIDOS</small></div></div>
  </div>
</div></div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var WORK=(parseInt(q.get('trabajo'),10)||25)*60,SHORT=(parseInt(q.get('descanso'),10)||5)*60,LONG=(parseInt(q.get('largo'),10)||15)*60,beep=q.get('sonido')!=='0';
  document.getElementById('c-work').textContent=Math.round(WORK/60);document.getElementById('c-rest').textContent=Math.round(SHORT/60);
  var C=2*Math.PI*44,arc=document.getElementById('arc');arc.style.strokeDasharray=C;var card=document.getElementById('card');
  var state={mode:'work',left:WORK,total:WORK,running:false,cycle:1,done:0,focusMin:0,streak:0};
  try{var sv=JSON.parse(localStorage.getItem('arcanum_pomo')||'{}');state.done=sv.done||0;state.focusMin=sv.focusMin||0;state.streak=sv.streak||0;}catch(e){}
  var timer=null;
  function fmt(x){var m=Math.floor(x/60),y=x%60;return(m<10?'0':'')+m+':'+(y<10?'0':'')+y;}
  function color(){card.style.setProperty('--accent',state.mode==='work'?'#A855F7':state.mode==='long'?'#4CE0F5':'#E838C8');}
  function labels(){var m=document.getElementById('mode'),t=document.getElementById('task');if(state.mode==='work'){m.textContent='⚔️ ENFOQUE';t.textContent='SESIÓN DE PODER';}else if(state.mode==='long'){m.textContent='🌌 DESCANSO LARGO';t.textContent='RECUPERA MANÁ';}else{m.textContent='🌙 DESCANSO';t.textContent='RESPIRA';}}
  function render(){document.getElementById('time').textContent=fmt(state.left);arc.style.strokeDashoffset=C*(1-state.left/state.total);document.getElementById('cycle').textContent='CICLO '+state.cycle;document.getElementById('done').textContent=state.done;document.getElementById('focusmin').textContent=state.focusMin;document.getElementById('streak').textContent=state.streak;document.getElementById('toggle').innerHTML=state.running?'❚❚ Pausar':'▶ Iniciar';color();labels();}
  function save(){try{localStorage.setItem('arcanum_pomo',JSON.stringify({done:state.done,focusMin:state.focusMin,streak:state.streak}));}catch(e){}}
  function ding(){if(!beep)return;try{var a=new(window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach(function(t){var o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=state.mode==='work'?880:660;g.gain.setValueAtTime(.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,a.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.16);o.start(a.currentTime+t);o.stop(a.currentTime+t+.17);});}catch(e){}}
  function next(auto){if(state.mode==='work'){state.done++;state.focusMin+=Math.round(state.total/60);state.streak++;save();if(state.cycle%4===0){state.mode='long';state.total=state.left=LONG;}else{state.mode='short';state.total=state.left=SHORT;}}else{if(state.mode==='long')state.cycle=1;else state.cycle++;state.mode='work';state.total=state.left=WORK;}if(auto)ding();render();}
  function tick(){if(state.left<=0){next(true);return;}state.left--;render();}
  document.getElementById('toggle').onclick=function(){state.running=!state.running;if(state.running){tick();timer=setInterval(tick,1000);}else clearInterval(timer);render();};
  document.getElementById('skip').onclick=function(){next(false);};
  document.getElementById('reset').onclick=function(){clearInterval(timer);state.running=false;state.mode='work';state.cycle=1;state.total=state.left=WORK;state.streak=0;save();render();};
  render();

  var root=document.getElementById('root'),el=root;
  function fit(){el.style.transform='none';var s=Math.min((innerWidth-8)/el.offsetWidth,(innerHeight-8)/el.offsetHeight);s=Math.max(.12,Math.min(s,1.5));el.style.transform='scale('+s+')';}
  function layout(){var wide=innerWidth>=640;root.classList.toggle('compact',!wide);root.style.width=wide?'980px':'460px';fit();}
  var raf;function sch(){cancelAnimationFrame(raf);raf=requestAnimationFrame(layout);}
  addEventListener('resize',sch);addEventListener('orientationchange',sch);if(window.ResizeObserver)new ResizeObserver(function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fit);}).observe(el);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
  layout();setTimeout(layout,300);
})();
</script></body></html>
