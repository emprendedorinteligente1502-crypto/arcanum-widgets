<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCANUM · Checklist</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Silkscreen&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191919;--violet:#A855F7;--magenta:#E838C8;--cyan:#4CE0F5;
    --ink:#EFE3FF;--muted:#8E7BB0;--line:rgba(168,85,247,.28);--danger:#FF5C7A;
    --margin:14px;      /* margen exterior en px */
    --radius:22px;      /* radio de las esquinas en px */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* Panel: llena vw/vh dejando margen en px, con radio en px */
  .app{position:fixed;inset:var(--margin);overflow:hidden;display:flex;flex-direction:column;
    border-radius:var(--radius);border:1px solid var(--line);
    background:
      radial-gradient(100% 80% at 50% 0%,rgba(232,56,200,.16),transparent 60%),
      radial-gradient(90% 90% at 12% 6%,rgba(168,85,247,.20),transparent 55%),
      linear-gradient(160deg,#1E1033,#120A20 78%);
    padding:clamp(14px,3.4vw,24px)}

  .gear{position:absolute;top:clamp(12px,2.8vw,18px);left:clamp(12px,2.8vw,18px);z-index:5;
    width:clamp(32px,7.5vw,40px);height:clamp(32px,7.5vw,40px);border-radius:11px;display:grid;place-items:center;
    background:rgba(168,85,247,.14);border:1px solid var(--line);color:var(--ink);cursor:pointer;font-size:clamp(14px,3.6vw,18px);transition:.16s;-webkit-user-select:none;user-select:none}
  .gear:hover{background:rgba(168,85,247,.28)}

  .head{flex:0 0 auto;text-align:center;padding:0 clamp(40px,11vw,52px) clamp(12px,3vw,16px)}
  .eyebrow{font-family:'Silkscreen',monospace;font-size:clamp(8px,2vw,11px);letter-spacing:.2em;color:var(--magenta);text-transform:uppercase}
  .head h1{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:clamp(19px,4.8vw,30px);line-height:1.14;margin-top:6px}

  /* Añadir tarea */
  .addrow{flex:0 0 auto;display:flex;gap:clamp(8px,2.2vw,12px);margin-bottom:clamp(10px,2.6vw,14px)}
  .addrow input{flex:1;min-width:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(14px,3.6vw,16px);color:var(--ink);background:rgba(10,6,17,.5);border:1px solid var(--line);border-radius:12px;padding:clamp(11px,2.8vw,13px) clamp(13px,3vw,15px);outline:none}
  .addrow input:focus{border-color:var(--violet)}
  .addbtn{flex:0 0 auto;width:clamp(44px,11vw,52px);border:0;border-radius:12px;background:linear-gradient(120deg,var(--violet),var(--magenta) 60%,var(--cyan));color:#fff;font-size:clamp(20px,5vw,24px);line-height:1;cursor:pointer;transition:.16s}
  .addbtn:hover{filter:brightness(1.1)}

  /* Lista */
  .list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:clamp(8px,2vw,11px);padding-right:2px}
  .list::-webkit-scrollbar{width:7px}.list::-webkit-scrollbar-thumb{background:rgba(168,85,247,.4);border-radius:4px}
  .item{display:flex;align-items:center;gap:clamp(11px,2.8vw,14px);background:rgba(10,6,17,.5);border:1px solid var(--line);border-radius:12px;padding:clamp(11px,2.8vw,14px) clamp(12px,3vw,15px);transition:.16s}
  .item:hover{border-color:rgba(168,85,247,.5)}
  .box{flex:0 0 auto;width:clamp(22px,5.6vw,26px);height:clamp(22px,5.6vw,26px);border:2px solid var(--violet);border-radius:7px;display:grid;place-items:center;color:transparent;font-size:clamp(13px,3.4vw,16px);font-weight:700;cursor:pointer;transition:.16s}
  .txt{flex:1;min-width:0;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(14px,3.6vw,16px);line-height:1.3;cursor:text;outline:none;word-break:break-word}
  .del{flex:0 0 auto;color:var(--muted);font-size:clamp(15px,3.8vw,18px);cursor:pointer;padding:2px 4px;transition:.16s;line-height:1}
  .del:hover{color:var(--danger)}
  .item.done{border-color:rgba(76,224,245,.4)}
  .item.done .box{background:linear-gradient(135deg,var(--violet),var(--magenta));border-color:transparent;color:#fff}
  .item.done .txt{color:var(--muted);text-decoration:line-through}
  .empty{margin:auto;text-align:center;color:var(--muted);font-size:clamp(13px,3.4vw,15px);line-height:1.7;padding:8% 10%}

  /* Progreso */
  .foot{flex:0 0 auto;margin-top:clamp(12px,3vw,16px)}
  .bar-head{display:flex;justify-content:space-between;font-family:'Silkscreen',monospace;font-size:clamp(7px,1.8vw,9px);letter-spacing:.14em;color:var(--muted);margin-bottom:7px}
  .bar-head b{color:var(--cyan);font-family:'Chakra Petch',sans-serif;letter-spacing:.02em}
  .track{height:clamp(8px,2vw,11px);border-radius:99px;background:rgba(10,6,17,.6);border:1px solid var(--line);overflow:hidden}
  .track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--magenta) 55%,var(--cyan));transition:width .5s cubic-bezier(.2,.8,.2,1)}

  /* Ajustes */
  .settings{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;justify-content:center;gap:clamp(10px,2.6vw,14px);
    padding:clamp(20px,5vw,40px);background:linear-gradient(160deg,#241540,#100a1c 80%);overflow:auto}
  .settings.on{display:flex}
  .settings h2{font-family:'Silkscreen',monospace;font-size:clamp(10px,2.4vw,12px);letter-spacing:.2em;color:var(--magenta);text-align:center;margin-bottom:4px}
  .field label{display:block;font-family:'Silkscreen',monospace;font-size:clamp(7px,1.8vw,9px);letter-spacing:.14em;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;font-family:'Space Grotesk',sans-serif;font-size:clamp(13px,3.2vw,15px);color:var(--ink);background:rgba(10,6,17,.6);border:1px solid var(--line);border-radius:10px;padding:clamp(10px,2.6vw,12px);outline:none}
  .field input:focus{border-color:var(--violet)}
  .minis{display:flex;gap:10px;margin-top:2px}
  .mini{flex:1;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:clamp(11px,2.8vw,13px);color:var(--muted);background:rgba(168,85,247,.1);border:1px solid var(--line);border-radius:10px;padding:clamp(9px,2.4vw,11px);cursor:pointer;transition:.16s;text-align:center;-webkit-user-select:none;user-select:none}
  .mini:hover{background:rgba(168,85,247,.2);color:var(--ink)}
  .srow{display:flex;gap:10px;margin-top:clamp(6px,1.6vw,10px)}
  .sbtn{flex:1;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:clamp(13px,3.2vw,15px);border-radius:10px;padding:clamp(11px,2.8vw,13px);cursor:pointer;border:1px solid var(--line);transition:.16s;-webkit-user-select:none;user-select:none;text-align:center}
  .sbtn.save{background:linear-gradient(120deg,var(--violet),var(--magenta) 60%,var(--cyan));border-color:transparent;color:#fff}
  .sbtn.cancel{background:rgba(168,85,247,.1);color:var(--muted)}
  .sbtn:hover{filter:brightness(1.1)}
</style></head>
<body>
  <div class="app" id="app">
    <button class="gear" id="gear" title="Ajustes">⚙</button>
    <div class="head">
      <div class="eyebrow" id="eyebrow">✦ Misiones del día</div>
      <h1 id="titulo">Lista de tareas</h1>
    </div>
    <div class="addrow">
      <input id="addInput" type="text" placeholder="Añadir una tarea…" maxlength="200">
      <button class="addbtn" id="addBtn" title="Añadir">+</button>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden>Sin tareas todavía.<br>Escribe arriba y pulsa <b style="color:#EFE3FF">+</b>.</div>
    <div class="foot">
      <div class="bar-head"><span>PROGRESO</span><b id="count">0 / 0</b></div>
      <div class="track"><i id="bar"></i></div>
    </div>

    <div class="settings" id="settings">
      <h2>⚙ Configurar checklist</h2>
      <div class="field"><label>TÍTULO</label><input id="f-titulo" type="text" placeholder="Lista de tareas"></div>
      <div class="field"><label>SUBTÍTULO</label><input id="f-eyebrow" type="text" placeholder="✦ Misiones del día"></div>
      <div class="minis"><div class="mini" id="clearDone">Borrar completadas</div><div class="mini" id="clearAll">Vaciar lista</div></div>
      <div class="srow"><div class="sbtn cancel" id="f-cancel">Cancelar</div><div class="sbtn save" id="f-save">Guardar</div></div>
    </div>
  </div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dec=function(s){try{return decodeURIComponent(s);}catch(e){return s;}};
  var $=function(id){return document.getElementById(id);};
  var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
  var KEY='arcanum_checklist_'+(q.get('id')||'default');

  var saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){}
  var st={
    titulo:saved.titulo||dec(q.get('titulo')||'Lista de tareas'),
    eyebrow:saved.eyebrow||dec(q.get('eyebrow')||'✦ Misiones del día'),
    items:saved.items|| (q.get('items')?dec(q.get('items')).split('|').map(function(t){return{id:uid(),text:t.trim(),done:false};}).filter(function(o){return o.text;}) : [
      {id:uid(),text:'Revisar objetivos del día',done:false},
      {id:uid(),text:'Sesión de enfoque',done:false},
      {id:uid(),text:'Ejercicio 20 min',done:false},
      {id:uid(),text:'Leer 20 páginas',done:false}
    ])
  };
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

  var listEl=$('list');
  function progress(){
    var total=st.items.length,done=st.items.filter(function(i){return i.done;}).length;
    $('count').textContent=done+' / '+total;
    $('bar').style.width=(total?done/total*100:0)+'%';
    $('empty').hidden=total>0;listEl.hidden=total===0;
  }
  function render(){
    $('titulo').textContent=st.titulo;$('eyebrow').textContent=st.eyebrow;
    listEl.innerHTML='';
    st.items.forEach(function(it){
      var row=document.createElement('div');row.className='item'+(it.done?' done':'');
      var box=document.createElement('div');box.className='box';box.textContent='✓';
      box.onclick=function(){it.done=!it.done;row.classList.toggle('done',it.done);save();progress();};
      var txt=document.createElement('div');txt.className='txt';txt.textContent=it.text;
      txt.onclick=function(){if(txt.isContentEditable)return;txt.contentEditable='true';txt.focus();
        var r=document.createRange();r.selectNodeContents(txt);var s=getSelection();s.removeAllRanges();s.addRange(r);};
      txt.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();txt.blur();}};
      txt.onblur=function(){txt.contentEditable='false';var t=txt.textContent.trim();if(t){it.text=t;}else{txt.textContent=it.text;}save();};
      var del=document.createElement('div');del.className='del';del.textContent='✕';
      del.onclick=function(){st.items=st.items.filter(function(x){return x.id!==it.id;});save();render();};
      row.appendChild(box);row.appendChild(txt);row.appendChild(del);
      listEl.appendChild(row);
    });
    progress();
  }

  function add(){var t=$('addInput').value.trim();if(!t)return;st.items.unshift({id:uid(),text:t,done:false});$('addInput').value='';save();render();$('addInput').focus();}
  $('addBtn').onclick=add;
  $('addInput').onkeydown=function(e){if(e.key==='Enter')add();};

  // Ajustes
  $('gear').onclick=function(){$('f-titulo').value=st.titulo;$('f-eyebrow').value=st.eyebrow;$('settings').classList.add('on');};
  $('f-cancel').onclick=function(){$('settings').classList.remove('on');};
  $('f-save').onclick=function(){st.titulo=$('f-titulo').value.trim()||'Lista de tareas';st.eyebrow=$('f-eyebrow').value.trim()||'✦ Misiones del día';save();$('settings').classList.remove('on');render();};
  $('clearDone').onclick=function(){st.items=st.items.filter(function(i){return !i.done;});save();render();};
  $('clearAll').onclick=function(){if(confirm('¿Vaciar toda la lista?')){st.items=[];save();render();}};

  render();
})();
</script></body></html>
