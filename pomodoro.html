<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCANUM · Pomodoro</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Silkscreen&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#191919;--violet:#A855F7;--magenta:#E838C8;--cyan:#4CE0F5;--ink:#EFE3FF;--muted:#8E7BB0;--line:rgba(168,85,247,.28);--accent:var(--violet)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:6px}
  .card{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% -10%,rgba(168,85,247,.20),transparent 60%),linear-gradient(160deg,#1E1033,#150C24 75%);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,4vw,26px);transition:--accent .4s}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(10px,3vw,18px)}
  .mode{font-family:'Silkscreen',monospace;font-size:clamp(9px,2.6vw,11px);letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
  .cycle{font-family:'Silkscreen',monospace;font-size:9px;letter-spacing:.14em;color:var(--muted)}
  .stage{display:flex;align-items:center;justify-content:center;gap:clamp(14px,4vw,30px);flex-wrap:wrap}
  .ring{position:relative;width:clamp(150px,42vw,200px);height:clamp(150px,42vw,200px);flex:0 0 auto}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .bg{fill:none;stroke:rgba(168,85,247,.14);stroke-width:9}
  .ring .fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--accent));transition:stroke-dashoffset .5s linear,stroke .4s}
  .disp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .time{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:clamp(34px,11vw,52px);line-height:1;letter-spacing:.01em}
  .of{font-family:'Silkscreen',monospace;font-size:8px;letter-spacing:.2em;color:var(--muted);margin-top:6px}
  .side{display:flex;flex-direction:column;gap:9px;min-width:120px}
  .btn{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:14px;letter-spacing:.03em;color:var(--ink);background:rgba(168,85,247,.12);border:1px solid var(--line);border-radius:11px;padding:11px 16px;cursor:pointer;transition:.18s;text-align:center;-webkit-user-select:none;user-select:none}
  .btn:hover{background:rgba(168,85,247,.24);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(120deg,var(--violet),var(--magenta));border-color:transparent;box-shadow:0 4px 18px rgba(168,85,247,.35)}
  .btn.ghost{font-size:12px;padding:8px 14px;color:var(--muted)}
  .stats{display:flex;gap:8px;margin-top:clamp(12px,3vw,18px)}
  .pill{flex:1;text-align:center;background:rgba(10,6,17,.5);border:1px solid var(--line);border-radius:10px;padding:9px 6px}
  .pill b{display:block;font-family:'Chakra Petch',sans-serif;font-size:18px}
  .pill small{font-family:'Silkscreen',monospace;font-size:7.5px;letter-spacing:.12em;color:var(--muted)}
  @media (max-width:360px){.side{width:100%}}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head"><div class="mode" id="mode">⚔️ ENFOQUE</div><div class="cycle" id="cycle">CICLO 1</div></div>
  <div class="stage">
    <div class="ring">
      <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="arc" cx="50" cy="50" r="44"/></svg>
      <div class="disp"><div class="time" id="time">25:00</div><div class="of" id="task">SESIÓN DE PODER</div></div>
    </div>
    <div class="side">
      <div class="btn primary" id="toggle">▶ Iniciar</div>
      <div class="btn" id="skip">⏭ Saltar</div>
      <div class="btn ghost" id="reset">↺ Reiniciar</div>
    </div>
  </div>
  <div class="stats">
    <div class="pill"><b id="done">0</b><small>ENFOQUES</small></div>
    <div class="pill"><b id="focusmin">0</b><small>MIN TOTALES</small></div>
    <div class="pill"><b id="streak">0</b><small>SEGUIDOS</small></div>
  </div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var WORK=(parseInt(q.get('trabajo'),10)||25)*60;
  var SHORT=(parseInt(q.get('descanso'),10)||5)*60;
  var LONG=(parseInt(q.get('largo'),10)||15)*60;
  var beep=q.get('sonido')!=='0';

  var C=2*Math.PI*44;
  var arc=document.getElementById('arc'); arc.style.strokeDasharray=C;
  var card=document.getElementById('card');

  var state={mode:'work',left:WORK,total:WORK,running:false,cycle:1,done:0,focusMin:0,streak:0};
  try{var s=JSON.parse(localStorage.getItem('arcanum_pomo')||'{}');state.done=s.done||0;state.focusMin=s.focusMin||0;state.streak=s.streak||0;}catch(e){}
  var timer=null;

  function fmt(s){var m=Math.floor(s/60),x=s%60;return(m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
  function color(){
    if(state.mode==='work'){card.style.setProperty('--accent','#A855F7');}
    else if(state.mode==='long'){card.style.setProperty('--accent','#4CE0F5');}
    else{card.style.setProperty('--accent','#E838C8');}
  }
  function labels(){
    var m=document.getElementById('mode'),t=document.getElementById('task');
    if(state.mode==='work'){m.textContent='⚔️ ENFOQUE';t.textContent='SESIÓN DE PODER';}
    else if(state.mode==='long'){m.textContent='🌌 DESCANSO LARGO';t.textContent='RECUPERA MANÁ';}
    else{m.textContent='🌙 DESCANSO';t.textContent='RESPIRA';}
  }
  function render(){
    document.getElementById('time').textContent=fmt(state.left);
    arc.style.strokeDashoffset=C*(1-state.left/state.total);
    document.getElementById('cycle').textContent='CICLO '+state.cycle;
    document.getElementById('done').textContent=state.done;
    document.getElementById('focusmin').textContent=state.focusMin;
    document.getElementById('streak').textContent=state.streak;
    document.getElementById('toggle').innerHTML=state.running?'❚❚ Pausar':'▶ Iniciar';
    color();labels();
  }
  function save(){try{localStorage.setItem('arcanum_pomo',JSON.stringify({done:state.done,focusMin:state.focusMin,streak:state.streak}));}catch(e){}}
  function ding(){
    if(!beep)return;
    try{var a=new(window.AudioContext||window.webkitAudioContext)();
      [0,0.18,0.36].forEach(function(t){var o=a.createOscillator(),g=a.createGain();
        o.connect(g);g.connect(a.destination);o.frequency.value=state.mode==='work'?880:660;
        g.gain.setValueAtTime(.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,a.currentTime+t+.02);
        g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.16);o.start(a.currentTime+t);o.stop(a.currentTime+t+.17);});
    }catch(e){}
  }
  function next(auto){
    if(state.mode==='work'){
      state.done++; state.focusMin+=Math.round(state.total/60); state.streak++; save();
      if(state.cycle%4===0){state.mode='long';state.total=state.left=LONG;}
      else{state.mode='short';state.total=state.left=SHORT;}
    }else{
      if(state.mode==='long')state.cycle=1; else state.cycle++;
      state.mode='work';state.total=state.left=WORK;
    }
    if(auto)ding();
    render();
  }
  function tick(){
    if(state.left<=0){next(true);return;}
    state.left--; render();
  }
  document.getElementById('toggle').onclick=function(){
    state.running=!state.running;
    if(state.running){tick();timer=setInterval(tick,1000);}else{clearInterval(timer);}
    render();
  };
  document.getElementById('skip').onclick=function(){next(false);};
  document.getElementById('reset').onclick=function(){
    clearInterval(timer);state.running=false;state.mode='work';state.cycle=1;
    state.total=state.left=WORK;state.streak=0;save();render();
  };
  render();
})();
</script>
</body>
</html>
