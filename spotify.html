<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCANUM · Spotify</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Silkscreen&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191919;--violet:#A855F7;--magenta:#E838C8;--cyan:#4CE0F5;
    --ink:#EFE3FF;--muted:#8E7BB0;--line:rgba(168,85,247,.28);
    --margin:14px;      /* margen exterior en px */
    --radius:22px;      /* radio de las esquinas en px */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* Panel: llena vw/vh dejando un margen en px, con radio en px */
  .app{position:fixed;inset:var(--margin);overflow:hidden;display:flex;flex-direction:column;
    border-radius:var(--radius);border:1px solid var(--line);
    background:
      radial-gradient(100% 80% at 50% 0%,rgba(232,56,200,.16),transparent 60%),
      radial-gradient(90% 90% at 12% 6%,rgba(168,85,247,.20),transparent 55%),
      linear-gradient(160deg,#1E1033,#120A20 78%);
    padding:clamp(14px,3.4vw,24px)}

  .gear{position:absolute;top:clamp(12px,2.8vw,18px);left:clamp(12px,2.8vw,18px);z-index:5;
    width:clamp(32px,7.5vw,40px);height:clamp(32px,7.5vw,40px);border-radius:11px;display:grid;place-items:center;
    background:rgba(168,85,247,.14);border:1px solid var(--line);color:var(--ink);cursor:pointer;font-size:clamp(14px,3.6vw,18px);transition:.16s;-webkit-user-select:none;user-select:none}
  .gear:hover{background:rgba(168,85,247,.28)}

  .head{flex:0 0 auto;text-align:center;padding:0 clamp(40px,11vw,52px) clamp(12px,3vw,18px)}
  .eyebrow{font-family:'Silkscreen',monospace;font-size:clamp(8px,2vw,11px);letter-spacing:.2em;color:var(--magenta);text-transform:uppercase}
  .head h1{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:clamp(19px,4.8vw,30px);line-height:1.14;margin-top:6px}

  /* Reproductor: llena el resto */
  .player{flex:1;min-height:0;min-width:0;border-radius:14px;overflow:hidden;background:rgba(10,6,17,.4);position:relative}
  .player iframe{width:100%;height:100%;border:0;display:block}
  .msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:clamp(12px,3vw,15px);line-height:1.6;padding:8% 12%}

  /* Panel de ajustes */
  .settings{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;justify-content:center;gap:clamp(10px,2.6vw,14px);
    padding:clamp(20px,5vw,40px);background:linear-gradient(160deg,#241540,#100a1c 80%);overflow:auto}
  .settings.on{display:flex}
  .settings h2{font-family:'Silkscreen',monospace;font-size:clamp(10px,2.4vw,12px);letter-spacing:.2em;color:var(--magenta);text-align:center;margin-bottom:4px}
  .field label{display:block;font-family:'Silkscreen',monospace;font-size:clamp(7px,1.8vw,9px);letter-spacing:.14em;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;font-family:'Space Grotesk',sans-serif;font-size:clamp(13px,3.2vw,15px);color:var(--ink);background:rgba(10,6,17,.6);border:1px solid var(--line);border-radius:10px;padding:clamp(10px,2.6vw,12px);outline:none}
  .field input:focus{border-color:var(--violet)}
  .hint{font-size:clamp(10px,2.4vw,12px);color:var(--muted);line-height:1.5}
  .srow{display:flex;gap:10px;margin-top:clamp(4px,1.4vw,8px)}
  .sbtn{flex:1;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:clamp(13px,3.2vw,15px);border-radius:10px;padding:clamp(11px,2.8vw,13px);cursor:pointer;border:1px solid var(--line);transition:.16s;-webkit-user-select:none;user-select:none;text-align:center}
  .sbtn.save{background:linear-gradient(120deg,var(--violet),var(--magenta) 60%,var(--cyan));border-color:transparent;color:#fff}
  .sbtn.cancel{background:rgba(168,85,247,.1);color:var(--muted)}
  .sbtn:hover{filter:brightness(1.1)}
</style></head>
<body>
  <div class="app" id="app">
    <button class="gear" id="gear" title="Cambiar lista">⚙</button>
    <div class="head">
      <div class="eyebrow" id="eyebrow">♫ Tu banda sonora</div>
      <h1 id="titulo">Lista de reproducción</h1>
    </div>
    <div class="player">
      <iframe id="player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      <div class="msg" id="msg">Pega un enlace válido de Spotify (lista, álbum, canción o artista) desde el botón ⚙.</div>
    </div>

    <div class="settings" id="settings">
      <h2>⚙ Configurar reproductor</h2>
      <div class="field"><label>ENLACE DE SPOTIFY</label><input id="f-link" type="text" placeholder="https://open.spotify.com/playlist/…"></div>
      <div class="field"><label>TÍTULO</label><input id="f-titulo" type="text" placeholder="Lista de reproducción"></div>
      <div class="hint">Abre Spotify → Compartir → Copiar enlace, y pégalo aquí. Sirve para listas, álbumes, canciones, artistas, podcasts.</div>
      <div class="srow"><div class="sbtn cancel" id="f-cancel">Cancelar</div><div class="sbtn save" id="f-save">Guardar</div></div>
    </div>
  </div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dec=function(s){try{return decodeURIComponent(s);}catch(e){return s;}};
  var $=function(id){return document.getElementById(id);};
  var KEY='arcanum_spotify_'+(q.get('id')||'default');
  var DEFAULT='https://open.spotify.com/playlist/3pPWq6jd6EmGreN9wKb7Ec?si=Utbc7JO1RWWbiCs34lX-RA';

  var saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){}
  var cfg={
    link:saved.link||dec(q.get('link')||DEFAULT),
    titulo:saved.titulo||dec(q.get('titulo')||'Lista de reproducción'),
    eyebrow:dec(q.get('eyebrow')||'♫ Tu banda sonora')
  };

  function embedSrc(url){
    var m=String(url||'').match(/(playlist|album|track|artist|show|episode)[\/:]([A-Za-z0-9]+)/);
    if(m)return 'https://open.spotify.com/embed/'+m[1]+'/'+m[2]+'?utm_source=generator&theme=0';
    return null;
  }
  function apply(){
    $('eyebrow').textContent=cfg.eyebrow;
    $('titulo').textContent=cfg.titulo;
    var src=embedSrc(cfg.link);
    if(src){$('player').style.display='';$('player').src=src;$('msg').style.display='none';}
    else{$('player').style.display='none';$('msg').style.display='flex';}
  }

  function open(){$('f-link').value=cfg.link;$('f-titulo').value=cfg.titulo;$('settings').classList.add('on');}
  function close(){$('settings').classList.remove('on');}
  $('gear').onclick=open;
  $('f-cancel').onclick=close;
  $('f-save').onclick=function(){
    var link=$('f-link').value.trim();
    if(link&&!embedSrc(link)){$('f-link').focus();$('f-link').style.borderColor='#FF5C7A';return;}
    $('f-link').style.borderColor='';
    cfg.link=link||DEFAULT;
    cfg.titulo=$('f-titulo').value.trim()||'Lista de reproducción';
    try{localStorage.setItem(KEY,JSON.stringify({link:cfg.link,titulo:cfg.titulo}));}catch(e){}
    close();apply();
  };

  apply();
})();
</script></body></html>
