<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCANUM · Título</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root{--bg:#191919;--violet:#A855F7;--magenta:#E838C8;--cyan:#4CE0F5;--ink:#F3ECFF;--muted:#9A87BD;--line:rgba(168,85,247,.5)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Cinzel',serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:4px;overflow:hidden}
  #card{width:840px;flex:0 0 auto;transform-origin:center center;position:relative;overflow:hidden;
    background:radial-gradient(120% 140% at 50% -30%,rgba(168,85,247,.22),transparent 62%),linear-gradient(180deg,#1B1030,#120A20 85%);
    border:1px solid rgba(168,85,247,.28);border-radius:18px;padding:30px 26px;text-align:center}
  #card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:
    radial-gradient(1.5px 1.5px at 20% 30%,rgba(255,255,255,.35),transparent),
    radial-gradient(1.5px 1.5px at 75% 25%,rgba(76,224,245,.4),transparent),
    radial-gradient(1.5px 1.5px at 60% 70%,rgba(232,56,200,.35),transparent),
    radial-gradient(1.5px 1.5px at 35% 80%,rgba(255,255,255,.3),transparent),
    radial-gradient(1px 1px at 88% 60%,rgba(255,255,255,.3),transparent)}
  #card>*{position:relative}
  .rule{display:flex;align-items:center;justify-content:center;gap:16px}
  .seg{height:1px;flex:1;max-width:250px;background:linear-gradient(90deg,transparent,var(--line) 70%,var(--cyan));transform:scaleX(0);transform-origin:right;animation:draw 1.1s .2s cubic-bezier(.2,.8,.2,1) forwards}
  .seg.r{background:linear-gradient(270deg,transparent,var(--line) 70%,var(--cyan));transform-origin:left}
  .dia{width:12px;height:12px;flex:0 0 auto;transform:rotate(45deg);background:linear-gradient(135deg,var(--cyan),var(--violet));border:1px solid rgba(255,255,255,.5);box-shadow:0 0 12px var(--cyan);animation:pulse 2.6s ease-in-out infinite}
  @keyframes draw{to{transform:scaleX(1)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 8px var(--cyan);opacity:.85}50%{box-shadow:0 0 18px var(--cyan),0 0 30px var(--violet);opacity:1}}
  .title{margin:16px 0;font-weight:700;letter-spacing:.14em;font-size:54px;line-height:1.05;white-space:nowrap;
    background:linear-gradient(100deg,#C9B6FF 0%,#fff 25%,#F5C6FF 50%,#fff 72%,#B7ECFF 100%);background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(168,85,247,.5));
    animation:sheen 6s linear infinite, rise 1s .1s ease both}
  @keyframes sheen{to{background-position:220% center}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sub{font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:.34em;color:var(--muted);text-transform:uppercase;animation:rise 1s .35s ease both}
  @media (prefers-reduced-motion:reduce){.seg,.seg.r{transform:scaleX(1);animation:none}.title{animation:none;background-position:50% center}.dia{animation:none}.sub{animation:none}}
</style>
</head>
<body>
 <div id="stage">
  <div id="card">
    <div class="rule">
      <span class="seg"></span><span class="dia"></span>
      <span class="seg r" style="max-width:44px;transform-origin:right"></span>
      <span class="dia"></span><span class="seg r"></span>
    </div>
    <h1 class="title" id="title">ARCANUM OS</h1>
    <div class="rule">
      <span class="seg"></span><span class="dia"></span>
      <span class="seg r" style="max-width:44px;transform-origin:right"></span>
      <span class="dia"></span><span class="seg r"></span>
    </div>
    <div class="sub" id="sub">Sistema de progreso personal</div>
  </div>
 </div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var dec=function(s){try{return decodeURIComponent(s);}catch(e){return s;}};
  if(q.get('texto')) document.getElementById('title').textContent=dec(q.get('texto'));
  if(q.get('sub')!==null) document.getElementById('sub').textContent=dec(q.get('sub'));
  if(q.get('sub')==='') document.getElementById('sub').style.display='none';
  var card=document.getElementById('card');
  function fit(){
    card.style.transform='none';
    var vw=window.innerWidth-8, vh=window.innerHeight-8;
    var w=card.offsetWidth, h=card.offsetHeight;
    var s=Math.min(vw/w, vh/h); s=Math.max(.15, Math.min(s,1.6));
    card.style.transform='scale('+s+')';
  }
  var raf;function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fit);}
  window.addEventListener('resize',schedule);
  window.addEventListener('orientationchange',schedule);
  if(window.ResizeObserver){new ResizeObserver(schedule).observe(document.body);}
  fit();
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit);}
  setTimeout(fit,300);setTimeout(fit,900);
})();
</script>
</body>
</html>
